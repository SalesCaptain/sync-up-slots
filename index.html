<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SalesCaptain Sync-Up Slots 🎰</title>
<link rel="icon" href=".src/salescaptainio_logo.jpeg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Monoton&family=Rubik:wght@400;600;800&family=Unbounded:wght@500;700;800;900&family=VT323&display=swap" rel="stylesheet">
<!--
  SYNC-UP SLOTS: who talks next at the daily sync.
  Open this file in Chrome and share the tab. Everything you'd want to edit
  (team, odds, words, phrases, bonuses) lives in the CONFIG block at the top of the <script>.
  Test hooks: index.html?selftest (logic tests), ?debug (window.slots API), ?fast, ?reset.
-->
<style>
:root{
  /* SalesCaptain brand palette (salescaptain.io): near-black, charcoal, lime + white */
  --bg:#141414; --char:#252525; --ink:#ffffff; --muted:#a3a3a3;
  --lime:#C0FF3C; --lime2:#D2FF45; --lime-pale:#eaffb8; --lime-deep:#7fae1c; --lime-dark:#2b3d05;
  --gold:var(--lime); --gold2:var(--lime2); --gold3:#3d3d3d;
  --cell: clamp(84px, min(11vw, 17.6vh), 200px);
  --display:'Unbounded', 'Arial Black', Impact, system-ui, sans-serif;   /* wide display, close to the brand's Chaney */
  --neon:'Monoton', 'Unbounded', Impact, sans-serif;
  --shade:'Unbounded', 'Arial Black', Impact, sans-serif;
  --body:'Rubik', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --led:'VT323', ui-monospace, Menlo, monospace;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0;min-height:100%}
body{
  min-height:100vh; overflow-x:hidden; color:var(--ink); font-family:var(--body);
  background:
    radial-gradient(1100px 650px at 50% 28%, rgba(192,255,60,.09) 0%, transparent 62%),
    radial-gradient(900px 600px at 8% 100%, rgba(192,255,60,.07) 0%, transparent 60%),
    radial-gradient(900px 600px at 95% 95%, rgba(255,255,255,.05) 0%, transparent 60%),
    var(--bg);
}
body::before{
  content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
  background-image: radial-gradient(rgba(255,255,255,.08) 1px, transparent 1.6px);
  background-size: 26px 26px;
  -webkit-mask-image: radial-gradient(ellipse at center, #000 25%, transparent 75%);
          mask-image: radial-gradient(ellipse at center, #000 25%, transparent 75%);
}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- spotlight beams ---------- */
.beams{position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden}
.beams i{
  position:absolute; bottom:-12vh; width:38vw; height:140vh; transform-origin:50% 100%;
  background: linear-gradient(to top, rgba(192,255,60,.16), rgba(192,255,60,0) 72%);
  clip-path: polygon(46% 100%, 54% 100%, 100% 0, 0 0); filter: blur(10px); mix-blend-mode: screen;
  animation: sweep 7s ease-in-out infinite alternate;
}
.beams i:nth-child(1){left:-8vw; --a:-28deg; --b:12deg}
.beams i:nth-child(2){right:-8vw; --a:28deg; --b:-12deg; animation-delay:-3s; background: linear-gradient(to top, rgba(255,255,255,.10), rgba(255,255,255,0) 72%)}
.beams i:nth-child(3){left:31vw; --a:-14deg; --b:14deg; animation-duration:9s; background: linear-gradient(to top, rgba(210,255,69,.10), rgba(210,255,69,0) 70%)}
@keyframes sweep{from{transform:rotate(var(--a))} to{transform:rotate(var(--b))}}
body.jackpot .beams i{animation-duration:1.1s; filter: blur(6px); background: linear-gradient(to top, rgba(192,255,60,.38), rgba(192,255,60,0) 75%)}

/* ---------- layout ---------- */
#app{position:relative; z-index:1; min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:16px 20px 24px}
.pod{
  max-width:min(1100px, 94vw); margin:0 auto 12px; padding:9px 24px; border-radius:999px; text-align:center;
  font-weight:800; font-size:clamp(14px, 1.25vw, 18px); color:var(--bg);
  background: linear-gradient(90deg, #8fc21f, var(--lime2) 25%, var(--lime) 50%, var(--lime2) 75%, #8fc21f);
  background-size:200% 100%; animation: shimmer 4s linear infinite, dropIn .7s cubic-bezier(.2,1.5,.4,1);
  box-shadow: 0 0 30px rgba(192,255,60,.4), inset 0 -3px 0 rgba(0,0,0,.18);
}
.pod .lbl{font-family:var(--display); font-weight:800; letter-spacing:.1em; font-size:.66em; margin-right:12px; opacity:.85; text-transform:uppercase}
@keyframes shimmer{to{background-position:-200% 0}}
@keyframes dropIn{from{transform:translateY(-40px) scale(.8); opacity:0} to{transform:none; opacity:1}}
.stage{
  flex:1; width:100%; max-width:1500px; display:grid; align-items:center; justify-content:center;
  grid-template-columns:auto minmax(270px, 330px); gap:clamp(36px, 5vw, 100px);
}
@media (max-width:1100px){
  .stage{grid-template-columns:1fr; justify-items:center}
}

/* ---------- machine ---------- */
.machine-wrap{position:relative; padding-right:70px}
.machine{
  position:relative; z-index:1; padding:24px 28px 20px; border-radius:44px 44px 24px 24px;
  background:
    radial-gradient(120% 60% at 50% 0%, rgba(192,255,60,.10), transparent 60%),
    linear-gradient(180deg, #2c2c2c 0%, #1c1c1c 45%, #0f0f0f 100%);
  box-shadow:
    0 0 0 4px #0a0a0a, 0 0 0 9px #3a3a3a, 0 0 0 12px var(--lime), 0 0 0 15px #1c2a05,
    0 30px 80px rgba(0,0,0,.7), 0 0 120px rgba(192,255,60,.16),
    inset 0 2px 0 rgba(255,255,255,.18), inset 0 -24px 40px rgba(0,0,0,.4);
}
.bulbs{position:absolute; inset:-10px; pointer-events:none; z-index:3}
.bulb{
  position:absolute; width:11px; height:11px; margin:-5.5px 0 0 -5.5px; border-radius:50%;
  background: radial-gradient(circle at 35% 35%, #fff 0 14%, var(--lime-pale) 32%, var(--lime-deep) 72%);
  box-shadow: 0 0 6px 2px rgba(210,255,69,.9), 0 0 16px 4px rgba(192,255,60,.45);
  --spd:1.5s;
  animation: bulb var(--spd) steps(1, end) infinite;
  animation-delay: calc(var(--ph) * var(--spd) / -3);
}
@keyframes bulb{0%{opacity:1} 33.33%{opacity:.25; box-shadow:none} 100%{opacity:.25; box-shadow:none}}
@keyframes bulbAll{0%{opacity:1} 50%{opacity:.2; box-shadow:none} 100%{opacity:.2; box-shadow:none}}
@keyframes strobe{50%{filter:brightness(1.9) saturate(0)}}
.machine[data-mode="spin"] .bulb{--spd:.36s}
.machine[data-mode="tension"] .bulb{--spd:.16s}
.machine[data-mode="over"] .bulb{--spd:2.6s}
.machine[data-mode="win"] .bulb{animation: bulbAll .28s steps(1, end) infinite}
.machine[data-mode="jackpot"] .bulb{
  animation: bulb .22s steps(1, end) infinite, strobe .3s steps(2, end) infinite;
  animation-delay: calc(var(--ph) * -.0733s), calc(var(--i) * -.02s);
}

.topper{
  text-align:center; margin:0 0 16px; padding:12px 18px 10px; border-radius:30px 30px 14px 14px;
  background: radial-gradient(ellipse at 50% 0%, #262626 0%, #0d0d0d 72%);
  box-shadow: inset 0 0 0 2px rgba(192,255,60,.45), inset 0 0 30px rgba(0,0,0,.85);
}
.brand{display:flex; align-items:center; justify-content:center; gap:10px; margin:0 0 8px}
.brand img{width:30px; height:30px; border-radius:8px; display:block; box-shadow:0 0 14px rgba(192,255,60,.45)}
.brand-name{font-family:var(--display); font-weight:900; font-size:clamp(13px, 1.2vw, 17px); letter-spacing:.04em; line-height:1; color:#fff}
.brand-name b{font-weight:900}
.brand-name b + b{color:var(--lime)}
.title{margin:0; font-weight:900; line-height:1; display:flex; gap:.28em; justify-content:center; align-items:center; flex-wrap:wrap}
.title .t1{font-family:var(--shade); font-weight:900; font-size:clamp(24px, 2.8vw, 44px); letter-spacing:-.01em; color:#fff; text-shadow:0 0 14px rgba(255,255,255,.25)}
.title .t2{
  font-family:var(--neon); font-weight:400; font-size:clamp(32px, 3.9vw, 62px); color:#f6ffe0;
  text-shadow:0 0 4px #fff, 0 0 10px var(--lime), 0 0 22px var(--lime), 0 0 44px var(--lime);
  animation: flicker 5s infinite;
}
@keyframes flicker{0%,90%,100%{opacity:1} 91%{opacity:.35} 92%{opacity:1} 95%{opacity:.6} 96%{opacity:1}}
.subtitle{margin:7px 0 0; font-family:var(--display); font-weight:700; font-size:clamp(9px, .85vw, 12px); letter-spacing:.2em; color:var(--muted); text-transform:uppercase}

/* ---------- reels ---------- */
.reels-frame{
  position:relative; padding:14px; border-radius:20px;
  background: linear-gradient(180deg, #f4f4f8, #9aa0ad 22%, #e9ebf0 48%, #6f7583 82%, #c9ccd4);
  box-shadow: inset 0 2px 2px rgba(255,255,255,.85), inset 0 -2px 3px rgba(0,0,0,.45), 0 8px 22px rgba(0,0,0,.55);
}
.reels{
  position:relative; display:flex; justify-content:center; gap:10px; padding:10px; border-radius:12px; background:#0b0b0b;
  box-shadow: inset 0 0 0 3px #2b3d05, inset 0 0 26px rgba(0,0,0,.95);
}
.reel{
  position:relative; width:var(--cell); height:calc(var(--cell) * 2.4); overflow:hidden; border-radius:10px;
  background: linear-gradient(90deg, #c9c9c9, #f2f2f2 18%, #ffffff 50%, #f2f2f2 82%, #c9c9c9);
}
.reel::after{
  content:""; position:absolute; inset:0; z-index:2; pointer-events:none;
  background: linear-gradient(180deg, rgba(14,14,14,.9) 0%, rgba(14,14,14,.4) 17%, rgba(0,0,0,0) 30%, rgba(0,0,0,0) 70%, rgba(14,14,14,.4) 83%, rgba(14,14,14,.9) 100%);
}
.slots{position:absolute; inset:0}
.cell{position:absolute; left:0; top:0; width:100%; height:var(--cell); padding:calc(var(--cell) * .045); will-change:transform}
.cell .face{
  position:relative; width:100%; height:100%; overflow:hidden; border-radius:calc(var(--cell) * .08);
  background:var(--lime); box-shadow: inset 0 0 0 2px rgba(0,0,0,.12), 0 2px 6px rgba(0,0,0,.25);
}
.cell img{display:block; width:100%; height:100%; object-fit:cover; user-select:none; -webkit-user-drag:none}
.cell .tag{
  position:absolute; left:8%; right:8%; bottom:6%; padding:2px 4px; border-radius:6px;
  background:rgba(20,20,20,.86); color:#fff; font-family:var(--display); font-weight:800; font-size:calc(var(--cell) * .064);
  line-height:1.3; letter-spacing:.01em; text-align:center; text-transform:uppercase;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.cell.wild .face{box-shadow: inset 0 0 0 calc(var(--cell) * .03) #fff, 0 0 16px rgba(192,255,60,.9)}
.cell.wild .tag{background: var(--lime); color:var(--bg)}
.cell.wild .face::after{
  content:"👑"; position:absolute; left:5%; top:3%; font-size:calc(var(--cell) * .2);
  transform:rotate(-18deg); filter: drop-shadow(0 2px 2px rgba(0,0,0,.5));
}
.hl{
  position:absolute; z-index:3; left:3px; right:3px; top:calc(var(--cell) * .7 + 2px); height:calc(var(--cell) - 4px);
  border-radius:12px; border:3px solid var(--hc, var(--lime)); opacity:0; pointer-events:none;
  box-shadow: 0 0 18px var(--hc, var(--lime)), inset 0 0 18px var(--hc, var(--lime));
}
.reels-frame.win .hl{animation: hl .42s ease-in-out infinite alternate}
.reels-frame.jackpot .hl{--hc:#ffffff; animation: hl .2s ease-in-out infinite alternate}
@keyframes hl{from{opacity:.25} to{opacity:1}}
.payline{
  position:absolute; z-index:5; left:16px; right:16px; top:50%; height:3px; transform:translateY(-50%); pointer-events:none;
  background: linear-gradient(90deg, transparent, #fff 5%, #fff 95%, transparent);
  box-shadow: 0 0 8px var(--lime), 0 0 18px rgba(192,255,60,.7); opacity:.75;
}
.reels-frame.win .payline, .reels-frame.jackpot .payline{opacity:1; animation: payflash .24s steps(2, end) infinite}
@keyframes payflash{50%{opacity:.25}}
.arrow{position:absolute; z-index:5; top:50%; width:0; height:0; border:12px solid transparent; transform:translateY(-50%); filter: drop-shadow(0 0 6px rgba(192,255,60,.9))}
.arrow.l{left:-6px; border-left-color:var(--gold)}
.arrow.r{right:-6px; border-right-color:var(--gold)}
.glass{
  position:absolute; inset:24px; z-index:4; border-radius:12px; pointer-events:none;
  background: linear-gradient(112deg, rgba(255,255,255,.2) 0%, rgba(255,255,255,.05) 28%, transparent 29%, transparent 62%, rgba(255,255,255,.07) 63%, transparent 76%);
}

/* ---------- console (stats + LED) ---------- */
.console{display:flex; gap:10px; margin-top:14px; align-items:stretch}
.stat{
  flex:0 0 auto; min-width:86px; padding:5px 10px 4px; border-radius:10px; text-align:center; background:#0c0616;
  box-shadow: inset 0 0 0 2px rgba(192,255,60,.3), inset 0 0 12px #000;
}
.stat b{display:block; font-family:var(--led); font-weight:400; font-size:34px; line-height:1; color:var(--lime); text-shadow:0 0 8px rgba(182,242,62,.75)}
.stat small{font-family:var(--display); font-weight:700; font-size:8px; letter-spacing:.16em; color:var(--muted)}
.stat.gold b{color:#fff; text-shadow:0 0 8px rgba(192,255,60,.9)}
.led{
  position:relative; flex:1; min-width:0; height:50px; overflow:hidden; border-radius:10px; background:#0a0d04;
  box-shadow: inset 0 0 0 2px #1f2a0a, inset 0 0 18px #000;
}
.led::after{
  content:""; position:absolute; inset:0; pointer-events:none;
  background: radial-gradient(circle, transparent 52%, rgba(0,0,0,.55) 56%) 0 0/4px 4px;
}
.led-track{
  position:absolute; top:50%; left:0; display:flex; white-space:nowrap; transform:translate(0,-50%);
  font-family:var(--led); font-size:32px; color:var(--lime2); text-shadow:0 0 6px var(--lime), 0 0 14px rgba(192,255,60,.6);
  animation: marquee var(--dur, 20s) linear infinite;
}
.led-track span{padding-right:90px}
@keyframes marquee{from{transform:translate(0,-50%)} to{transform:translate(-50%,-50%)}}
.led-flash{
  position:absolute; inset:0; display:grid; place-items:center; text-align:center; white-space:nowrap;
  font-family:var(--led); font-size:34px; color:var(--lime-pale); text-shadow:0 0 8px var(--lime), 0 0 18px rgba(192,255,60,.7);
  animation: blink .5s steps(2, end) infinite; background:#0a0d04; z-index:1;
}
.led-flash:empty{display:none}
@keyframes blink{50%{color:rgba(210,255,69,.3); text-shadow:none}}
.tray{
  margin:14px auto 0; width:58%; height:26px; border-radius:0 0 24px 24px;
  background: linear-gradient(#050505, #262626);
  box-shadow: inset 0 9px 14px rgba(0,0,0,.95), 0 0 0 3px #3a3a3a, 0 0 0 5px var(--lime);
}

/* ---------- lever ---------- */
.lever-wrap{position:absolute; right:0; top:50%; width:76px; height:0; --L:150px; --s:1; --ky:0; --ks:1; z-index:2}
.lever-housing{
  position:absolute; left:-8px; top:-50px; width:54px; height:100px; border-radius:0 28px 28px 0;
  background: linear-gradient(90deg, #5a5f6b, #eef0f4 40%, #9aa0ad 72%, #4b505a);
  box-shadow: 0 6px 16px rgba(0,0,0,.55), inset 0 0 0 2px rgba(0,0,0,.2);
}
.lever-rod{
  position:absolute; left:29px; bottom:0; width:14px; height:var(--L); border-radius:7px;
  transform-origin:50% 100%; transform:scaleY(var(--s));
  background: linear-gradient(90deg, #4b505a, #f5f6f8 45%, #a5aab5 72%, #3e434c);
  box-shadow: 0 0 8px rgba(0,0,0,.35);
}
.lever-pivot{
  position:absolute; left:22px; top:-14px; width:28px; height:28px; border-radius:50%;
  background: radial-gradient(circle at 35% 35%, #fff, #9aa0ad 60%, #3e434c); box-shadow:0 2px 5px rgba(0,0,0,.6);
}
.lever-knob{
  position:absolute; left:6px; top:calc(-1 * var(--L) - 30px); width:60px; height:60px; padding:0; border:0; border-radius:50%;
  cursor:grab; touch-action:none; -webkit-tap-highlight-color:transparent;
  background: radial-gradient(circle at 32% 28%, #fff 0 6%, var(--lime-pale) 14%, var(--lime) 46%, #4d6b0a 90%);
  box-shadow: 0 8px 18px rgba(0,0,0,.6), 0 0 26px rgba(192,255,60,.55), inset -4px -6px 10px rgba(0,0,0,.3);
  transform: translateY(calc(var(--ky) * 1px)) scale(var(--ks));
}
.lever-wrap.grab .lever-knob{cursor:grabbing}
.lever-knob:focus-visible{outline:3px solid #fff; outline-offset:4px}
.lever-knob:disabled{cursor:not-allowed; filter:saturate(.35) brightness(.75)}
.pull-hint{
  position:absolute; left:0; width:72px; top:calc(-1 * var(--L) - 98px); text-align:center; line-height:1.1;
  font-family:var(--display); font-weight:900; font-size:13px; color:var(--lime); text-shadow:0 0 10px var(--lime);
  animation: bob 1s ease-in-out infinite; transition:opacity .3s; pointer-events:none;
}
.machine-wrap:not([data-state="idle"]) .pull-hint{opacity:0}
@keyframes bob{50%{transform:translateY(8px)}}

/* ---------- side panel ---------- */
.panel{
  width:100%; max-width:340px; padding:16px 18px 12px; border-radius:22px;
  background: linear-gradient(180deg, rgba(37,37,37,.92), rgba(20,20,20,.94));
  box-shadow: inset 0 0 0 1px rgba(192,255,60,.3), 0 20px 50px rgba(0,0,0,.5);
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
}
@media (max-width:1100px){ .panel{max-width:640px} .faces{grid-template-columns:repeat(6, 1fr) !important} }
.panel h2{
  display:flex; justify-content:space-between; align-items:baseline; gap:8px; margin:4px 0 10px;
  font-family:var(--display); font-weight:800; font-size:11px; letter-spacing:.12em; color:var(--lime); text-transform:uppercase;
}
.panel h2 small{font-family:var(--body); font-size:11px; letter-spacing:0; color:var(--muted); text-transform:none}
.wild-card{
  all:unset; box-sizing:border-box; width:100%; display:flex; align-items:center; gap:12px; margin:0 0 14px; padding:10px 12px;
  border-radius:16px; cursor:pointer; position:relative; overflow:hidden;
  background: linear-gradient(100deg, rgba(192,255,60,.18), rgba(192,255,60,.04) 70%);
  box-shadow: inset 0 0 0 1px var(--lime), 0 0 18px rgba(192,255,60,.18);
}
.wild-card::after{ /* slow shine sweep */
  content:""; position:absolute; inset:0; pointer-events:none;
  background: linear-gradient(105deg, transparent 35%, rgba(255,255,255,.14) 50%, transparent 65%); background-size:250% 100%;
  animation: shimmer 3.5s linear infinite;
}
.wild-card:focus-visible{outline:2px solid #fff}
.wild-card .wc-av{position:relative; flex:0 0 auto}
.wild-card img{display:block; width:52px; height:52px; border-radius:50%; object-fit:cover; box-shadow:0 0 0 3px #fff, 0 0 16px var(--lime)}
.wild-card .wc-av .badge{position:absolute; left:50%; top:-15px; transform:translateX(-50%) rotate(-10deg); font-size:20px; filter:drop-shadow(0 1px 2px #000)}
.wild-card .wc-text{flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; line-height:1.25}
.wild-card .wc-kick{font-family:var(--display); font-weight:900; font-size:10px; letter-spacing:.14em; color:var(--lime)}
.wild-card .wc-name{font-weight:800; font-size:14px; color:#fff}
.wild-card .wc-name span{font-weight:600; color:var(--muted)}
.wild-card .wc-rule{font-size:11px; color:var(--lime-pale)}
.wild-card .wc-odds{flex:0 0 auto; text-align:center; font-family:var(--led); font-size:28px; line-height:.9; color:var(--lime); text-shadow:0 0 8px rgba(192,255,60,.7)}
.wild-card .wc-odds small{display:block; font-family:var(--body); font-size:9px; letter-spacing:.06em; color:var(--muted); text-shadow:none}
.wild-card.absent{background:rgba(255,255,255,.04); box-shadow: inset 0 0 0 1px #444}
.wild-card.absent::after{display:none}
.wild-card.absent img{filter:grayscale(1) brightness(.5); box-shadow:0 0 0 2px #555}
.wild-card.absent .wc-kick, .wild-card.absent .wc-rule, .wild-card.absent .wc-odds{color:var(--muted); text-shadow:none}
.faces{list-style:none; margin:0 0 14px; padding:0; display:grid; grid-template-columns:repeat(4, 1fr); gap:10px 4px}
.face-btn{
  all:unset; box-sizing:border-box; position:relative; width:100%; display:flex; flex-direction:column; align-items:center; gap:4px;
  padding:4px 0; border-radius:12px; cursor:pointer; text-align:center;
}
.face-btn:focus-visible{outline:2px solid var(--lime)}
.face-btn .av{position:relative; display:block; width:54px; height:54px}
.face-btn img{width:54px; height:54px; border-radius:50%; object-fit:cover; display:block; box-shadow:0 0 0 2px var(--lime), 0 4px 10px rgba(0,0,0,.4); transition:transform .2s, filter .2s}
.face-btn:hover img{transform:scale(1.08) rotate(-3deg)}
.face-btn .nm{font-size:11px; font-weight:600; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.face-btn.wild img{box-shadow:0 0 0 3px #fff, 0 0 14px var(--lime)}
.face-btn.wild .nm{color:var(--lime)}
.face-btn .badge{position:absolute; right:-6px; top:-8px; font-size:18px; filter:drop-shadow(0 1px 2px #000)}
.face-btn.absent img{filter:grayscale(1) brightness(.5); box-shadow:0 0 0 2px #555}
.face-btn.absent .nm{color:var(--muted); text-decoration:line-through}

.btn{

/* ---------- popping words / mega text ---------- */
#pops{position:fixed; inset:0; z-index:55; pointer-events:none; overflow:hidden}
.pop{
  position:absolute; font-family:var(--display); font-weight:900; text-transform:uppercase; white-space:nowrap; color:#fff;
  text-shadow: 0 0 4px var(--c), 0 0 12px var(--c), 0 0 26px var(--c), 0 3px 0 rgba(0,0,0,.55);
  transform: translate(-50%,-50%) rotate(var(--r));
  animation: pop 1.7s cubic-bezier(.2,.9,.3,1) forwards;
}
@keyframes pop{
  0%{opacity:0; transform:translate(-50%,-50%) rotate(calc(var(--r) - 25deg)) scale(.2)}
  14%{opacity:1; transform:translate(-50%,-50%) rotate(var(--r)) scale(1.25)}
  24%{transform:translate(-50%,-50%) rotate(var(--r)) scale(1)}
  72%{opacity:1}
  100%{opacity:0; transform:translate(-50%, calc(-50% - 90px)) rotate(var(--r)) scale(.95)}
}
.mega{
  position:fixed; left:50%; top:42%; z-index:58; pointer-events:none; opacity:0; white-space:nowrap;
  transform:translate(-50%,-50%); font-family:var(--shade); font-weight:900; font-size:clamp(48px, 9vw, 140px);
  background: linear-gradient(90deg, var(--lime), #fff, var(--lime2), #fff, var(--lime)); background-size:200% 100%;
  -webkit-background-clip:text; background-clip:text; color:transparent;
  filter: drop-shadow(0 0 22px rgba(192,255,60,.85)); animation: shimmer 1s linear infinite;
}

.overlay{
  position:fixed; inset:0; z-index:50; display:grid; place-items:center; padding:20px; overflow:hidden;

const Q = new URLSearchParams(location.search);
const REDUCED = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const FAST = Q.has('fast');
const SPEED = FAST ? 0.3 : REDUCED ? 0.45 : 1;

// Unbiased crypto randomness.
const RNG = (() => {
  const buf = new Uint32Array(512); let i = buf.length;
  const u32 = () => { if (i >= buf.length) { crypto.getRandomValues(buf); i = 0; } return buf[i++]; };
  const int = (n) => { // uniform in [0, n), rejection sampling: no modulo bias
    if (n <= 1) return 0;
    const lim = 4294967296 - (4294967296 % n);
    let x; do { x = u32(); } while (x >= lim);
    return x % n;
  };
  const float = () => u32() / 4294967296;
  const pick = (a) => a[int(a.length)];
  const range = (lo, hi) => lo + float() * (hi - lo);
  const shuffle = (a) => { const b = a.slice(); for (let k = b.length - 1; k > 0; k--) { const j = int(k + 1); [b[k], b[j]] = [b[j], b[k]]; } return b; };

})();

  const byId = Object.fromEntries(TEAM.map(p => [p.id, p]));

  const wildOn = (s) => !!wild && !s.absent.includes(wild.id);
  const reelPool = (s) => [...remaining(s), ...(wildOn(s) ? [wild] : [])];

const Store = (() => {
  const PREFIX = 'sync-slots:v1:', PREFS = 'sync-slots:prefs';
  const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
  function load() {
    const date = today();
    try {
      for (let k = localStorage.length - 1; k >= 0; k--) { // tidy up previous days
        const key = localStorage.key(k);
        if (key && key.startsWith(PREFIX) && key !== PREFIX + date) localStorage.removeItem(key);
      }
      const raw = localStorage.getItem(PREFIX + date);
      if (raw) return Logic.sanitize(JSON.parse(raw), date);
    } catch (e) { /* storage unavailable: play without persistence */ }
    return Logic.fresh(date);
  }
  const save = (s) => { try { localStorage.setItem(PREFIX + s.date, JSON.stringify(s)); } catch (e) {} };
  const wipe = () => { try { localStorage.removeItem(PREFIX + today()); } catch (e) {} };
  const prefs = () => { try { return JSON.parse(localStorage.getItem(PREFS)) || {}; } catch (e) { return {}; } };
  const savePrefs = (p) => { try { localStorage.setItem(PREFS, JSON.stringify(p)); } catch (e) {} };
  return { today, load, save, wipe, prefs, savePrefs };
})();

/* =====================================================================
   Self-test: index.html?selftest
   ===================================================================== */
function runSelfTest() {
  const out = []; let fails = 0;
  const check = (name, cond, detail) => { out.push(`${cond ? 'PASS' : 'FAIL'}  ${name}${detail ? '   [' + detail + ']' : ''}`); if (!cond) fails++; };
  const ids = Logic.speakers.map(p => p.id).sort();
  const wildId = Logic.wild && Logic.wild.id;

  // 1. Full games: everyone speaks exactly once, the wildcard never "speaks", every game ends.
  const G = 20000; let spins = 0, jackpots = 0, good = 0, wildSpoke = 0, stuck = 0, consistent = 0;
  const first = Object.fromEntries(ids.map(i => [i, 0]));
  for (let g = 0; g < G; g++) {
    const s = Logic.fresh('test'); let n = 0, firstSeen = false;
    while (!Logic.isOver(s) && n < 1000) {
      const r = Logic.pick(s, RNG); n++;
      if (r.type === 'jackpot') jackpots++; else if (!firstSeen) { first[r.id]++; firstSeen = true; }
      Logic.apply(s, r, RNG);
    }
    spins += n; if (!Logic.isOver(s)) stuck++;
    if (JSON.stringify(s.spoken.slice().sort()) === JSON.stringify(ids) && new Set(s.spoken).size === s.spoken.length) good++;
    if (wildId && s.spoken.includes(wildId)) wildSpoke++;
    if (s.bonuses.length === s.jackpots && (s.jackpots > 0) === (s.phrase !== null)) consistent++;
  }
  check(`${G} games: every speaker spoke exactly once`, good === G, `${good}/${G}`);
  check('every game ended (no endless loops)', stuck === 0, `stuck=${stuck}`);
  check('the wildcard never lands in Spoke', wildSpoke === 0);
  check('bonuses and phrase of the day match the jackpot count', consistent === G, `${consistent}/${G}`);
  const rate = jackpots / spins;
  check(`jackpot rate ≈ ${JACKPOT_CHANCE * 100}% (±1%)`, Math.abs(rate - JACKPOT_CHANCE) <= 0.01, `${(rate * 100).toFixed(2)}% of ${spins} spins, ${(jackpots / G).toFixed(2)} per game`);
  const exp = G / ids.length;
  const chi = ids.reduce((a, i) => a + (first[i] - exp) ** 2 / exp, 0);
  check(`first speaker is uniform (chi² < 30, ${ids.length - 1} dof)`, chi < 30, `chi²=${chi.toFixed(2)}; ` + ids.map(i => `${i}:${first[i]}`).join(' '));

  // 2. Absent people are never picked; the game ends when the present ones have spoken.
  {
    const away = ids.slice(0, 2); let picked = 0, ok = 0;
    for (let g = 0; g < 3000; g++) {
      const s = Logic.fresh('t'); away.forEach(id => Logic.toggleAbsent(s, id)); let n = 0;
      while (!Logic.isOver(s) && n++ < 1000) { const r = Logic.pick(s, RNG); if (away.includes(r.id)) picked++; Logic.apply(s, r, RNG); }
      if (s.spoken.length === ids.length - 2) ok++;
    }
    check('absent people are never picked', picked === 0 && ok === 3000, `picked=${picked}, complete=${ok}/3000`);
  }
  // 3. No jackpots while the wildcard is away.
  if (wildId) {
    let j = 0;
    for (let g = 0; g < 3000; g++) {
      const s = Logic.fresh('t'); Logic.toggleAbsent(s, wildId);
      while (!Logic.isOver(s)) { const r = Logic.pick(s, RNG); if (r.type === 'jackpot') j++; Logic.apply(s, r, RNG); }
    }
    check('no jackpots while the wildcard is away', j === 0, `jackpots=${j}`);
  }
  // 4. Undo rewinds picks, skips and jackpots back to a fresh state.
  {
    let ok = 0;
    for (let g = 0; g < 500; g++) {
      const s = Logic.fresh('t'); const start = JSON.stringify(s);
      for (let k = 0; k < 40 && !Logic.isOver(s); k++) {
        const r = Logic.pick(s, RNG); Logic.apply(s, r, RNG);
        if (r.type === 'speaker' && RNG.float() < 0.3) Logic.skip(s, r.id);
      }
      while (Logic.undo(s)); if (JSON.stringify(s) === start) ok++;
    }
    check('undo rewinds every pick, skip and jackpot', ok === 500, `${ok}/500`);
  }
  // 5. Phrase of the day: set by the first jackpot, then it stays.
  if (wildId) {
    const s = Logic.fresh('t');
    Logic.apply(s, { type: 'jackpot', id: wildId }, RNG); const p1 = s.phrase;
    const info = Logic.apply(s, { type: 'jackpot', id: wildId }, RNG);
    check('phrase of the day is set once and stays', !!p1 && s.phrase === p1 && !info.first && s.jackpots === 2 && s.bonuses.length === 2 && s.bonuses[0] !== s.bonuses[1]);
  }
  // 6. Misc.
  { const c = [0, 0, 0]; for (let k = 0; k < 300000; k++) c[RNG.int(3)]++; check('RNG.int(3) is uniform', c.every(x => Math.abs(x - 100000) < 1500), c.join(' / ')); }
  { const s = Logic.fresh('t'); ids.forEach(id => s.spoken.push(id)); check('pick returns null once everyone has spoken', Logic.pick(s, RNG) === null); }
  { const s = Logic.sanitize({ v: 1, spoken: ['nobody', ids[0], ids[0], wildId], absent: 5, jackpots: -3, history: 'x' }, 'd');
    check('sanitize tolerates junk storage', s.spoken.join() === ids[0] && s.absent.length === 0 && s.jackpots === 0 && s.history.length === 0); }
  { const s = Logic.fresh('t'); const r = Logic.pick(s, RNG, ids[3]); check('forced pick (debug) works', r.type === 'speaker' && r.id === ids[3]); }

  const verdict = fails ? `SELFTEST FAIL (${fails})` : 'SELFTEST PASS';
  document.title = verdict;
  document.body.innerHTML = '';
  const pre = document.createElement('pre'); pre.id = 'selftest';
  pre.style.cssText = 'position:relative;z-index:9;margin:24px;padding:20px;border-radius:12px;background:#000;color:' + (fails ? '#ff6b6b' : '#b6f23e') + ';font:14px/1.6 ui-monospace,Menlo,monospace;white-space:pre-wrap';
  pre.textContent = verdict + '\n\n' + out.join('\n');
  document.body.appendChild(pre);
}

      for (let i = 0; i < n; i++) { const a = Math.random() * 6.283, v = rnd(speed[0], speed[1]);
        add({ k: 'spark', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, drag: 2.2, grav: 260, s: rnd(1.5, 3.2), c: colors[(Math.random() * colors.length) | 0], life: rnd(0.5, 1.1) }); }
    }
    function explode(x, y) {
      const c1 = pickC(), c2 = pickC(), n = REDUCED ? 30 : 90;
      for (let i = 0; i < n; i++) { const a = (i / n) * 6.283 + rnd(-0.05, 0.05), v = rnd(140, 360);
        add({ k: 'spark', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, drag: 1.6, grav: 120, s: rnd(1.6, 3), c: Math.random() < 0.5 ? c1 : c2, life: rnd(0.9, 1.6) }); }
      Sound.boom();
    }
    function coinRain(ms) {
      const end = performance.now() + ms;
      const iv = setInterval(() => {
        if (performance.now() > end) return clearInterval(iv);
        for (let i = 0; i < (REDUCED ? 1 : 3); i++) add({ k: 'coin', x: rnd(0, W), y: -30, vx: rnd(-60, 60), vy: rnd(100, 300), r: rnd(9, 18), spin: rnd(0, 6), vs: rnd(6, 16), tilt: rnd(-0.3, 0.3), life: 7 });
      }, 45);
    }
    function fountain(x, y, n = 60) {
      for (let i = 0; i < n; i++) add({ k: 'coin', x: x + rnd(-40, 40), y, vx: rnd(-420, 420), vy: -rnd(600, 1250), r: rnd(8, 15), spin: rnd(0, 6), vs: rnd(6, 16), tilt: rnd(-0.3, 0.3), life: 6 });

  /* ---------------- popping words ---------------- */
  const Pops = (() => {
    const layer = $('#pops');
    const COLS = ['#C0FF3C', '#D2FF45', '#ffffff', '#eaffb8', '#9fd62a'];
    let timer = 0; const recent = [];
    function word(list = POP_WORDS) {
      let w, k = 0;
      do { w = RNG.pick(list); } while (recent.includes(w) && ++k < 12);
      recent.push(w); if (recent.length > 10) recent.shift();
      return w;
    }
    function spot() { // somewhere lively, but never on the reels, the roster or an open card
      const m = machine.getBoundingClientRect(), open = !overlay.hidden;
      const avoid = [reelsEl.getBoundingClientRect(), panelEl.getBoundingClientRect()];
      if (open) avoid.push(card.getBoundingClientRect());
      const area = open ? { l: 0, r: innerWidth, t: 0, b: innerHeight } : { l: m.left - 150, r: m.right + 150, t: m.top - 20, b: m.bottom };
      for (let k = 0; k < 24; k++) {
        const x = Math.max(90, Math.min(innerWidth - 90, area.l + Math.random() * (area.r - area.l)));
        const y = Math.max(30, Math.min(innerHeight - 30, area.t + Math.random() * (area.b - area.t)));
        if (!avoid.some(r => x > r.left - 110 && x < r.right + 110 && y > r.top - 26 && y < r.bottom + 110)) return [x, y];
      }
      return [90 + Math.random() * (innerWidth - 180), 40];
    }
    function pop(text, size) {
      const el = document.createElement('div'); el.className = 'pop'; el.textContent = text || word();
      const [x, y] = spot();
      el.style.left = x + 'px'; el.style.top = y + 'px';
      el.style.fontSize = (size || 15 + Math.random() * 18) + 'px';
      el.style.setProperty('--c', COLS[RNG.int(COLS.length)]);
      el.style.setProperty('--r', ((Math.random() - 0.5) * 28).toFixed(1) + 'deg');
      el.addEventListener('animationend', () => el.remove());
      layer.appendChild(el); Sound.pop();
      const half = el.offsetWidth / 2 + 12; el.style.left = Math.max(half, Math.min(innerWidth - half, x)) + 'px';
      if (layer.childElementCount > 40) layer.firstElementChild.remove();
    }
    function start() { stop(); const tick = () => { pop(); timer = setTimeout(tick, 240 + Math.random() * 260); }; timer = setTimeout(tick, 160); }
    function stop() { clearTimeout(timer); timer = 0; }
    function burst(n, sizeMin = 22, list) { for (let i = 0; i < n; i++) setTimeout(() => pop(list ? word(list) : null, sizeMin + Math.random() * 16), i * 120); }
    const clear = () => layer.replaceChildren();
    return { pop, start, stop, burst, clear };
  })();

  /* ---------------- reels ---------------- */
  // Each reel is a logical strip of face ids; only 6 DOM cells are recycled as it scrolls.
  // pos = strip index sitting on the payline. Symbols travel downward, so pos decreases during a spin.
  const Reels = (() => {
    const SLOTS = 6;
    const reels = [...document.querySelectorAll('.reel')].map((el, i) => {
      const box = el.querySelector('.slots'); const cells = [];
      for (let j = 0; j < SLOTS; j++) {
        const c = document.createElement('div'); c.className = 'cell';
        c.innerHTML = '<div class="face"><img alt="" draggable="false"><span class="tag"></span></div>';
        box.appendChild(c); cells.push({ el: c, img: c.querySelector('img'), tag: c.querySelector('.tag'), id: null });
      }
      return { el, box, cells, i, ids: [], vis: [], pos: 2, fe: document.querySelector(`#mb${i} feGaussianBlur`), blurOn: false };
    });
    let cellPx = 0;
    const measure = () => { cellPx = reels[0].el.getBoundingClientRect().width; };
    function draw(r) {
      const base = Math.floor(r.pos) - 2;
      for (let idx = base; idx < base + SLOTS; idx++) {
        const c = r.cells[((idx % SLOTS) + SLOTS) % SLOTS], id = r.ids[idx];
        if (!id) { c.el.style.visibility = 'hidden'; continue; }
        c.el.style.visibility = '';
        if (c.id !== id) {
          const p = Logic.byId[id]; c.id = id;
          delete c.img.dataset.fb; c.img.dataset.id = id; c.img.src = imgOf(p);
          c.tag.textContent = p.name; c.el.classList.toggle('wild', !!p.wildcard);
        }
        c.el.style.transform = `translate3d(0, ${((idx - r.pos + 0.7) * cellPx).toFixed(2)}px, 0)`;
      }
    }
    function setBlur(r, px) {
      if (px < 0.5) { if (r.blurOn) { r.box.style.filter = ''; r.blurOn = false; } return; }
      if (r.fe) r.fe.setAttribute('stdDeviation', `0 ${px.toFixed(2)}`);
      if (!r.blurOn) { r.box.style.filter = `url(#mb${r.i})`; r.blurOn = true; }
    }
    const pickId = (pool, avoid) => { const c = pool.filter(p => !avoid.includes(p.id)); return RNG.pick(c.length ? c : pool).id; };
    function seq(pool, n, prevId, lastAvoid) { // random faces, no two neighbours alike (when possible)
      const out = []; let prev = prevId;
      for (let k = 0; k < n; k++) { const id = pickId(pool, k === n - 1 ? [prev, lastAvoid] : [prev]); out.push(id); prev = id; }
      return out;
    }
    function idle(pool) {
      measure();
      reels.forEach(r => { r.ids = seq(pool, 5, null, null); r.vis = r.ids.slice(); r.pos = 2; draw(r); setBlur(r, 0); });
    }
    function redraw() { measure(); reels.forEach(draw); }

    function spinReel(r, o) {
      const a1 = pickId(o.pool, [o.target]), a0 = pickId(o.pool, [a1]);
      const head = [a0, a1, o.target]; if (o.tease) head.push(o.tease);
      const ids = [...head, ...seq(o.pool, o.cells, head[head.length - 1], r.vis[0]), ...r.vis];
      const S = ids.length - 3;            // where the current payline face sits in the new strip
      const F = o.tease ? 3 : 2;           // first stop (3 = fake stop on the wildcard)
      const D = S - F, T = o.dur;
      r.ids = ids; r.pos = S; draw(r);

      // velocity-continuous accelerate / cruise / decelerate profile on [0,1]
      const ta = 0.12, td = o.long ? 0.55 : 0.38, n = o.long ? 4 : 3, tc = 1 - ta - td;
      const v = 1 / (ta / 2 + tc + td / n);
      const g = (s) => s < ta ? v * s * s / (2 * ta)
        : s < ta + tc ? v * ta / 2 + v * (s - ta)
        : v * ta / 2 + v * tc + (v * td / n) * (1 - Math.pow(1 - (s - ta - tc) / td, n));
      const tA = 0.14 * Math.min(1, SPEED * 2);                   // wind-up (strip nudges back first)
      const tHold = o.tease ? 0.65 * Math.max(0.5, SPEED) : 0;    // shiver on the wildcard...
      const tSlip = o.tease ? 0.34 : 0;                           // ...then slip one notch
      const tB = 0.42 * Math.max(0.6, SPEED);                     // overshoot + settle
      const tMain = tA + T, tEnd = tMain + tHold + tSlip + tB;

      return new Promise(resolve => {
        const t0 = performance.now(); let last = t0, lastPos = S, lastCell = Math.round(S), impacted = false, teased = false;
        function frame(now) {
          const t = (now - t0) / 1000; let pos;
          if (t < tA) pos = S + 0.22 * Math.sin(Math.PI * t / tA);
          else if (t < tMain) pos = S - D * g((t - tA) / T);
          else if (t < tMain + tHold) { if (!teased) { teased = true; o.onTease && o.onTease(); } const h = (t - tMain) / tHold; pos = F + Math.sin(h * 42) * 0.035 * (1 - h); }
          else if (t < tMain + tHold + tSlip) { const u = (t - tMain - tHold) / tSlip; pos = F - u * u; }
          else {
            if (!impacted) { impacted = true; o.onStop && o.onStop(); }
            const u = Math.min(1, (t - tMain - tHold - tSlip) / tB);
            pos = 2 - 0.17 * Math.sin(u * 2.5 * Math.PI) * Math.pow(1 - u, 2.5);
          }
          const dt = Math.max(0.001, (now - last) / 1000), vel = Math.abs(pos - lastPos) / dt; last = now; lastPos = pos;
          r.pos = pos; draw(r); setBlur(r, Math.min(cellPx * 0.09, Math.max(0, (vel - 2.5) * 0.8)));
          const c = Math.round(pos); if (c !== lastCell) { lastCell = c; Sound.tick(); }
          if (t < tEnd) requestAnimationFrame(frame);
          else { r.ids = ids.slice(0, 5); r.vis = r.ids.slice(); r.pos = 2; draw(r); setBlur(r, 0); resolve(); }
        }
        requestAnimationFrame(frame);
      });
    }

    async function spin(result, pool, hooks) {
      measure();
      const jackpot = result.type === 'jackpot';
      const wildId = Logic.wild && pool.some(p => p.id === Logic.wild.id) ? Logic.wild.id : null;
      const tease = !jackpot && !!wildId && pool.length > 1 && RNG.float() < TEASE_CHANCE;
      const base = RNG.range(1.5, 1.85), gap = RNG.range(0.45, 0.65);
      await Promise.all(reels.map((r, i) => {
        let dur = base + gap * i, long = false;
        if (i === 2 && jackpot) { dur += 1.4; long = true; }
        if (i === 2 && tease) { dur += 0.35; long = true; }
        const cells = Math.max(6, Math.round(dur * 10 * (SPEED < 1 ? 0.5 : 1)) + RNG.int(4));
        return spinReel(r, { target: result.id, pool, dur: dur * SPEED, cells, long,
          tease: i === 2 && tease ? wildId : null, onStop: () => hooks.onStop(i, r), onTease: hooks.onTease });
      }));
    }
    return { idle, spin, redraw, reels };
  })();

  /* ---------------- bulbs around the cabinet ---------------- */
  const bulbsEl = $('#bulbs');
  function layoutBulbs() {
    const W = bulbsEl.offsetWidth, H = bulbsEl.offsetHeight; if (!W || !H) return;
    const rt = 54, rb = 34, q = Math.PI / 2;
    const segs = [ // rounded-rect perimeter, clockwise from top-left
      { len: W - 2 * rt, at: (d) => [rt + d, 0] },
      { len: q * rt, at: (d) => { const a = -q + d / rt; return [W - rt + Math.cos(a) * rt, rt + Math.sin(a) * rt]; } },
      { len: H - rt - rb, at: (d) => [W, rt + d] },
      { len: q * rb, at: (d) => { const a = d / rb; return [W - rb + Math.cos(a) * rb, H - rb + Math.sin(a) * rb]; } },
      { len: W - 2 * rb, at: (d) => [W - rb - d, H] },
      { len: q * rb, at: (d) => { const a = q + d / rb; return [rb + Math.cos(a) * rb, H - rb + Math.sin(a) * rb]; } },
      { len: H - rt - rb, at: (d) => [0, H - rb - d] },
      { len: q * rt, at: (d) => { const a = Math.PI + d / rt; return [rt + Math.cos(a) * rt, rt + Math.sin(a) * rt]; } },
    ];
    const total = segs.reduce((a, s) => a + s.len, 0), n = Math.max(24, Math.round(total / 30));
    const frag = document.createDocumentFragment();
    for (let k = 0; k < n; k++) {
      let d = (k / n) * total, s = 0;
      while (d > segs[s].len && s < segs.length - 1) { d -= segs[s].len; s++; }
      const [x, y] = segs[s].at(d);
      const b = document.createElement('i'); b.className = 'bulb';
      b.style.left = x.toFixed(1) + 'px'; b.style.top = y.toFixed(1) + 'px';
      b.style.setProperty('--i', k); b.style.setProperty('--ph', k % 3);
      frag.appendChild(b);
    }
    bulbsEl.replaceChildren(frag);
  }

  /* ---------------- lever ---------------- */
  const Lever = (() => {
    const wrap = $('#leverWrap'), knob = $('#lever');
    let p = 0, raf = 0, dragging = false, pulling = false, enabled = true, startY = 0, startP = 0, moved = 0, notch = 0, onPull = () => {};
    const len = () => parseFloat(getComputedStyle(wrap).getPropertyValue('--L')) || 150;
    function set(v) { // v: 0 = up, 1 = fully pulled; rod flips toward the viewer around its pivot
      p = Math.max(-0.15, Math.min(1, v)); const a = p * Math.PI, L = len();
      wrap.style.setProperty('--s', Math.cos(a).toFixed(4));
      wrap.style.setProperty('--ky', (L * (1 - Math.cos(a))).toFixed(2));
      wrap.style.setProperty('--ks', (1 + 0.22 * Math.sin(a)).toFixed(3));
    }
    function tween(to, ms, ease) {
      cancelAnimationFrame(raf);
      return new Promise(res => {
        const from = p, t0 = performance.now();
        const f = (now) => { const u = Math.min(1, (now - t0) / ms); set(from + (to - from) * ease(u)); if (u < 1) raf = requestAnimationFrame(f); else { raf = 0; res(); } };
        raf = requestAnimationFrame(f);
      });
    }
    const spring = (u) => 1 - Math.exp(-6 * u) * Math.cos(u * 13);
    async function fire() { Sound.lever(); onPull(); await tween(0, 900 * Math.max(0.5, SPEED), spring); pulling = false; }
    async function auto() {
      if (!enabled || dragging || pulling) return;
      pulling = true; Sound.init();
      await tween(1, 240, (u) => u * u * u);
      await fire();
    }
    knob.addEventListener('pointerdown', (e) => {
      if (!enabled || pulling || e.button > 0) return;
      e.preventDefault(); Sound.init();
      dragging = true; startY = e.clientY; startP = p; moved = 0; notch = 0;
      try { knob.setPointerCapture(e.pointerId); } catch (_) {}
      wrap.classList.add('grab');
    });
    knob.addEventListener('pointermove', (e) => {
      if (!dragging) return;
      const dy = e.clientY - startY; moved = Math.max(moved, Math.abs(dy));
      set(startP + dy / (2 * len()));
      const n = Math.floor(p * 8); if (n > notch) { notch = n; Sound.click(); }
    });
    async function end() {
      if (!dragging) return;
      dragging = false; wrap.classList.remove('grab');
      if (moved < 6) return auto();                  // a plain click = automatic pull
      if (p > 0.6) { pulling = true; await tween(1, 80, (u) => u); await fire(); }
      else await tween(0, 500, spring);              // not far enough: spring back, no spin
    }
    knob.addEventListener('pointerup', end);
    knob.addEventListener('pointercancel', end);
    knob.addEventListener('click', (e) => { if (e.detail === 0) auto(); }); // keyboard activation of the button
    set(0);
    return {
      auto,
      onPull(fn) { onPull = fn; },
      setEnabled(v) { enabled = v; knob.disabled = !v; },
      focus() { try { knob.focus({ preventScroll: true }); } catch (_) {} },
    };
  })();

  /* ---------------- LED ticker ---------------- */
  const ticker = $('#ticker'), ledFlash = $('#ledFlash');
  let tickerText = '', tickerPhrase = RNG.pick(PHRASES), flashTimer = 0;
  function setTicker(text) {
    if (text === tickerText) return; tickerText = text;
    const t = esc(text);
    ticker.innerHTML = `<span>${t}</span><span>${t}</span>`;
    ticker.style.setProperty('--dur', Math.max(10, text.length * 0.2).toFixed(1) + 's');
    ticker.style.animation = 'none'; void ticker.offsetWidth; ticker.style.animation = '';
  }
  function flash(text, ms) { // static blinking LED message, shrunk to fit the panel
    clearTimeout(flashTimer); ledFlash.textContent = text || '';
    if (text) ledFlash.style.fontSize = Math.max(16, Math.min(34, Math.floor(ledFlash.parentElement.clientWidth / (Array.from(text).length * 0.52)))) + 'px';
    if (text && ms) flashTimer = setTimeout(() => { ledFlash.textContent = ''; }, ms);

  /* ---------------- app state + rendering ---------------- */
  if (Q.has('reset')) { Store.wipe(); Q.delete('reset'); history.replaceState(null, '', location.pathname + (Q.toString() ? '?' + Q : '')); }
  let state = Store.load();
  let busy = false, overlayMode = null, currentWinner = null, forced = null, holdPod = false;
  const prefs = Store.prefs(); Sound.setMuted(!!prefs.muted);

  const sr = $('#sr');
  const announce = (t) => { sr.textContent = ''; setTimeout(() => { sr.textContent = t; }, 30); };
  const setMode = (m) => { machine.dataset.mode = m; };
  function shake(a) {
    if (REDUCED || !a) return;
    const k = []; for (let i = 0; i < 6; i++) k.push({ transform: `translate(${((Math.random() - 0.5) * 2 * a).toFixed(1)}px, ${((Math.random() - 0.5) * 2 * a).toFixed(1)}px)` });
    k.push({ transform: 'none' }); wrapEl.animate(k, { duration: 340, easing: 'ease-out' });
  }
  function ledText() {
    const rem = Logic.remaining(state).length, parts = [];
    if (Logic.isOver(state)) parts.push(state.spoken.length ? 'SYNC COMPLETE ★ GO MAKE TODAY AWESOME' : 'NOBODY HERE? CLICK FACES IN THE ROSTER TO MARK THEM PRESENT');
    else parts.push(state.spoken.length ? `${rem} TO GO ★ PULL THE LEVER FOR THE NEXT SPEAKER` : 'PULL THE LEVER TO PICK THE FIRST SPEAKER');
    if (state.phrase) parts.push(`PHRASE OF THE DAY: ${state.phrase}`);
    else if (Logic.wildOn(state)) parts.push(`HIT ${Logic.wild.name} ×3 FOR THE TEAM JACKPOT`);

  const waitingEl = $('#waiting'), spokeEl = $('#spoke'), bonusesEl = $('#bonuses');
  let shownSpoken = state.spoken.length; // rows already on screen (only new rows animate in)
  function render() {
    const rem = Logic.remaining(state), over = Logic.isOver(state);
    $('#statToGo').textContent = String(rem.length).padStart(2, '0');
    $('#statBonus').textContent = '×' + state.jackpots;
    wrapEl.dataset.state = busy ? 'busy' : over ? 'over' : overlayMode ? 'busy' : 'idle';
    if (!busy && !overlayMode) setMode(over ? 'over' : 'idle');
    Lever.setEnabled(!busy && !overlayMode && !over);

    const waiting = Logic.speakers.filter(p => !state.spoken.includes(p.id)); // the wildcard has its own jackpot card below
    waitingEl.replaceChildren(...waiting.map(p => {
      const away = state.absent.includes(p.id);
      const li = document.createElement('li'), b = document.createElement('button');
      b.type = 'button'; b.dataset.id = p.id;
      b.className = 'face-btn' + (p.wildcard ? ' wild' : '') + (away ? ' absent' : '');
      b.setAttribute('aria-pressed', String(away));
      b.title = `${p.name}${p.wildcard ? ' (wildcard: jackpot)' : ''}: ${away ? 'away today, click to bring back' : 'here, click to mark away'}`;
      b.innerHTML = `<span class="av"><img data-id="${esc(p.id)}" src="${esc(imgOf(p))}" alt="">${away ? '<span class="badge">🏖️</span>' : p.wildcard ? '<span class="badge">👑</span>' : ''}</span><span class="nm">${esc(p.name)}</span>`;
      li.appendChild(b); return li;
    }));

    const wc = $('#wildCard'), w = Logic.wild;
    wc.hidden = !w;
    if (w) {
      const away = state.absent.includes(w.id);
      wc.classList.toggle('absent', away); wc.dataset.id = w.id; wc.setAttribute('aria-pressed', String(away));
      wc.title = away ? `${w.name} is away today: no jackpots. Click to bring him back.` : `Click if ${w.name} is away today (turns jackpots off).`;
      wc.innerHTML = `<span class="wc-av"><img data-id="${esc(w.id)}" src="${esc(imgOf(w))}" alt=""><span class="badge">${away ? '🏖️' : '👑'}</span></span>`
        + `<span class="wc-text"><span class="wc-kick">JACKPOT CARD</span>`
        + `<span class="wc-name">${esc(w.name)} <span>· team lead</span></span>`
        + `<span class="wc-rule">${away ? 'Away today: no jackpots' : 'Land him ×3 = bonus for the whole team'}</span></span>`
        + `<span class="wc-odds">${away ? 'OFF' : Math.round(JACKPOT_CHANCE * 100) + '%'}<small>${away ? 'today' : 'per spin'}</small></span>`;
    }

    if (state.spoken.length) {
      spokeEl.replaceChildren(...state.spoken.map((id, i) => {
        const p = Logic.byId[id], li = document.createElement('li'); li.dataset.id = id;
        if (i >= shownSpoken) li.className = 'new';
        li.innerHTML = `<span class="n">${i + 1}</span><img data-id="${esc(id)}" src="${esc(imgOf(p))}" alt=""><span class="nm">${esc(p.name)}</span><span class="ck">✓</span>`;
        return li;
      }));
    } else spokeEl.innerHTML = '<li class="empty" style="background:none;padding:0">Nobody yet. Pull the lever!</li>';
    shownSpoken = state.spoken.length;

    bonusesEl.innerHTML = state.bonuses.length
      ? state.bonuses.map(b => `<li>💰 ${esc(b)}</li>`).join('')
      : `<li class="empty" style="background:none;color:var(--muted);padding:0;font-weight:400">Land ${esc(Logic.wild ? Logic.wild.name : 'the wildcard')} ×3 to unlock team bonuses 👑</li>`;

    const pod = $('#pod');
    if (state.phrase && !holdPod) { $('#podText').textContent = `“${state.phrase}”`; pod.hidden = false; } else pod.hidden = true;

    $('#btnUndo').disabled = busy || !!overlayMode || !state.history.length;
    $('#btnNew').disabled = busy || !!overlayMode;
    $('#btnMute').textContent = Sound.muted ? '🔇 Muted' : '🔊 Sound';
    setTicker(ledText());
  }
  const save = () => Store.save(state);

  /* ---------------- the pull ---------------- */
  async function pull() {
    if (busy || overlayMode) return;
    if (Logic.isOver(state)) { render(); return; }
    const pool = Logic.reelPool(state);
    const result = Logic.pick(state, RNG, forced); forced = null;
    busy = true; render();
    setMode('spin'); frameEl.classList.remove('win', 'jackpot');
    flash('★ SPINNING ★ WHO WILL IT BE? ★');
    Pops.start();
    const jackpot = result.type === 'jackpot';
    await Reels.spin(result, pool, {
      onStop(i, r) {
        Sound.stop(i); shake(i === 2 ? 5 : 3);
        const rc = r.el.getBoundingClientRect(); FX.sparks(rc.left + rc.width / 2, rc.bottom - 6, 16);
        if (jackpot && i === 1) {
          setMode('tension'); flash('!!! 👑 👑 ... ? !!!'); Sound.suspense(1.9 * SPEED); Sound.siren(1.6 * SPEED);
          Pops.pop('JACKPOT?!', 34);
        }
      },
      onTease() { Sound.tease(); flash('SO CLOSE…'); Pops.pop('So close! 😱', 28); },
    });
    Pops.stop(); flash('');
    const info = Logic.apply(state, result, RNG); save();
    tickerPhrase = RNG.pick(PHRASES);
    busy = false;
    if (jackpot) celebrateJackpot(info); else celebrateWinner(result.id);
  }

  function reelsCenter() { const r = reelsEl.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; }

  function celebrateWinner(id) {
    const p = Logic.byId[id]; currentWinner = id;
    overlayMode = 'pending'; render();
    setMode('win'); frameEl.classList.add('win'); Sound.win(); shake(6);
    FX.cannons(); const [cx, cy] = reelsCenter(); FX.confetti(cx, cy, 70, -Math.PI / 2, Math.PI * 2, [300, 800]);
    Pops.burst(6);
    flash(`★ ${p.name.toUpperCase()} ×3 ★`);
    announce(`${p.name} is up next.`);
    setTimeout(() => openWinner(p), REDUCED ? 250 : 800);
  }
  function celebrateJackpot(info) {
    holdPod = !!info.first; // the new phrase of the day is revealed on the card, then pinned when it closes
    overlayMode = 'pending'; render();
    setMode('jackpot'); document.body.classList.add('jackpot'); frameEl.classList.add('jackpot');
    Sound.jackpot(); Sound.siren(2); shake(12);
    megaText('JACKPOT!!!');
    FX.coinRain(3500); const t = $('#tray').getBoundingClientRect(); FX.fountain(t.left + t.width / 2, t.top, 70); FX.cannons();
    Pops.burst(8, 24, JACKPOT_WORDS);
    flash('★ TEAM JACKPOT ★');
    announce(`Team jackpot! ${Logic.wild.name} landed: bonus for the whole team.`);
    setTimeout(() => openJackpot(info), REDUCED ? 300 : 1400);
  }
  function megaText(text) {
    const el = $('#mega'); el.textContent = text;
    if (REDUCED) return;
    el.animate([
      { opacity: 0, transform: 'translate(-50%,-50%) scale(.2) rotate(-14deg)' },
      { opacity: 1, transform: 'translate(-50%,-50%) scale(1.18) rotate(3deg)', offset: 0.22 },
      { opacity: 1, transform: 'translate(-50%,-50%) scale(1) rotate(0deg)', offset: 0.4 },
      { opacity: 1, transform: 'translate(-50%,-50%) scale(1.06) rotate(0deg)', offset: 0.78 },
      { opacity: 0, transform: 'translate(-50%,-50%) scale(1.7) rotate(0deg)' },
    ], { duration: 1800, easing: 'ease-out' });
  }

  /* ---------------- overlays ---------------- */
  function openOverlay(kind, html) {
    overlayMode = kind; overlay.className = 'overlay is-' + kind; card.innerHTML = html; overlay.hidden = false;
    Pops.clear();
    card.style.animation = 'none'; void card.offsetWidth; card.style.animation = '';
    render();
    setTimeout(() => { const b = card.querySelector('[data-primary]'); if (b) b.focus({ preventScroll: true }); }, 60);
  }
  function closeOverlay() { overlay.hidden = true; overlayMode = null; holdPod = false; frameEl.classList.remove('win', 'jackpot'); document.body.classList.remove('jackpot'); flash(''); render(); }
  const nameSize = (s) => Math.round(Math.min(58, 440 / Math.max(4, s.length * 0.95)));

  function openWinner(p) {
    openOverlay('winner', `
      <div class="kicker">★ THE MACHINE HAS SPOKEN ★</div>
      <div class="photo"><img data-id="${esc(p.id)}" src="${esc(imgOf(p))}" alt=""></div>
      <h2 class="name" id="cardTitle" style="font-size:${nameSize(p.name)}px">${esc(p.name)}</h2>
      <p class="announce">${esc(fillName(p.announce ? (Array.isArray(p.announce) ? RNG.pick(p.announce) : p.announce) : RNG.pick(ANNOUNCE), p))}</p>
      <p class="phrase">“${esc(RNG.pick(PHRASES))}”</p>
      <div class="actions">
        <button class="btn-big" type="button" data-act="go" data-primary>Let's go 🎤</button>
        <button class="btn-ghost" type="button" data-act="skip">Not here, skip</button>
      </div>
      <p class="hint">Space / Enter to continue</p>`);
    Pops.burst(4);
  }
  function openJackpot(info) {
    const w = Logic.wild;
    openOverlay('jackpot', `
      <div class="kicker gold">👑 TEAM LEAD JACKPOT 👑</div>
      <div class="photo"><img data-id="${esc(w.id)}" src="${esc(imgOf(w))}" alt=""><span class="crown">👑</span></div>
      <h2 class="name rainbow" id="cardTitle" style="font-size:50px">JACKPOT!</h2>
      <p class="announce">${esc(fillName(RNG.pick(JACKPOT_LINES), w))}</p>
      <div class="bonus"><small>BONUS FOR THE WHOLE TEAM</small><b>${esc(info.bonus)}</b></div>
      <div class="podbox"><small>${info.first ? '⭐ TEAM PHRASE OF THE DAY ⭐' : 'MORE TEAM SPIRIT'}</small><q>${esc(info.first ? state.phrase : info.phrase)}</q></div>
      <div class="actions"><button class="btn-big" type="button" data-act="collect" data-primary>Collect &amp; pull again 💰</button></div>
      <p class="hint">${info.first ? 'The phrase of the day stays on screen for the rest of the day' : 'Bonus added to today’s list'} · Space to continue</p>`);
  }
  function openFinale() {
    const recap = state.spoken.map((id, i) => { const p = Logic.byId[id]; return `<li><span class="n">${i + 1}</span><img data-id="${esc(id)}" src="${esc(imgOf(p))}" alt="">${esc(p.name)}</li>`; }).join('');
    const j = state.jackpots;
    openOverlay('finale', `
      <div class="kicker">🎉 SYNC COMPLETE 🎉</div>
      <h2 class="name" id="cardTitle" style="font-size:40px;margin-top:14px">That's a wrap!</h2>
      <p class="announce">${esc(RNG.pick(FINALE))}</p>
      ${recap ? `<ol class="recap">${recap}</ol>` : ''}
      <p class="meta">${state.spoken.length} speaker${state.spoken.length === 1 ? '' : 's'} · ${j} jackpot${j === 1 ? '' : 's'}${state.absent.length ? ` · ${state.absent.length} away` : ''}</p>
      ${state.phrase ? `<div class="podbox"><small>⭐ PHRASE OF THE DAY ⭐</small><q>${esc(state.phrase)}</q></div>` : ''}
      <div class="actions">
        <button class="btn-big" type="button" data-act="close" data-primary>Close</button>
        <button class="btn-ghost" type="button" data-act="new">Start a new sync</button>
      </div>`);
    setMode('win'); Sound.finale(); FX.fireworks(REDUCED ? 1500 : 6000); FX.cannons();
    announce('Sync complete. Everyone has spoken.');
  }

  function flyToSpoke(fromRect, id) {
    const li = spokeEl.querySelector(`li[data-id="${CSS.escape(id)}"]`); const target = li && li.querySelector('img');
    if (!target || !fromRect || REDUCED) return;
    li.scrollIntoView({ block: 'nearest' });
    const to = target.getBoundingClientRect(); target.style.visibility = 'hidden';
    const img = document.createElement('img'); img.className = 'flyer'; img.src = imgOf(Logic.byId[id]); img.alt = '';
    Object.assign(img.style, { left: fromRect.left + 'px', top: fromRect.top + 'px', width: fromRect.width + 'px', height: fromRect.height + 'px' });
    document.body.appendChild(img);
    const dx = to.left - fromRect.left, dy = to.top - fromRect.top, sc = to.width / fromRect.width;
    const a = img.animate([
      { transform: 'translate(0,0) scale(1) rotate(0deg)' },
      { transform: `translate(${dx * 0.45}px, ${dy * 0.45 - 140}px) scale(${(1 + sc) / 2}) rotate(200deg)`, offset: 0.55 },
      { transform: `translate(${dx}px, ${dy}px) scale(${sc}) rotate(360deg)` },
    ], { duration: 850, easing: 'cubic-bezier(.5,0,.3,1)' });
    a.onfinish = () => { img.remove(); target.style.visibility = ''; FX.sparks(to.left + to.width / 2, to.top + to.height / 2, 26, ['#C0FF3C', '#fff', '#D2FF45']); Sound.coin(); };
  }
  function afterTurn() { if (Logic.isOver(state) && state.spoken.length) setTimeout(() => { if (!overlayMode && !busy) openFinale(); }, REDUCED ? 100 : 900); }

  const actions = {
    go() {
      const img = card.querySelector('.photo img'), from = img && img.getBoundingClientRect(), id = currentWinner;
      closeOverlay(); flyToSpoke(from, id); Lever.focus(); afterTurn();
    },
    skip() {
      const p = Logic.byId[currentWinner];
      Logic.skip(state, currentWinner); save(); closeOverlay();
      flash(`NO ${p.name.toUpperCase()} TODAY? PULL AGAIN!`, 2600); Lever.focus(); afterTurn();
    },
    collect() { closeOverlay(); Pops.burst(3); Lever.focus(); },
    close() { closeOverlay(); Lever.focus(); },
    new() { closeOverlay(); newSync(true); },
  };
  const primary = () => { const b = card.querySelector('[data-primary]'); if (b) actions[b.dataset.act](); };
  card.addEventListener('click', (e) => { const b = e.target.closest('[data-act]'); if (b && actions[b.dataset.act]) actions[b.dataset.act](); });

  /* ---------------- panel controls ---------------- */
  function toggleAway(id) {
    if (!id || busy || overlayMode) return;
    Sound.init(); Logic.toggleAbsent(state, id); save(); Sound.click();
    Reels.idle(Logic.reelPool(state).length ? Logic.reelPool(state) : TEAM);
    render();
  }
  waitingEl.addEventListener('click', (e) => { const b = e.target.closest('.face-btn'); if (b) toggleAway(b.dataset.id); });
  $('#wildCard').addEventListener('click', (e) => { toggleAway(e.currentTarget.dataset.id); e.currentTarget.blur(); });
  $('#btnMute').addEventListener('click', (e) => { toggleMute(); e.currentTarget.blur(); });
  $('#btnUndo').addEventListener('click', (e) => {
    e.currentTarget.blur(); if (busy || overlayMode) return;
    const h = Logic.undo(state); if (!h) return; save(); Sound.init(); Sound.click();
    flash(h.t === 'jackpot' ? 'JACKPOT UNDONE' : h.t === 'skip' ? 'SKIP UNDONE' : `${Logic.byId[h.id].name.toUpperCase()} IS BACK IN THE POOL`, 2200);
    render();
  });
  $('#btnNew').addEventListener('click', (e) => { e.currentTarget.blur(); newSync(false); });
  function newSync(confirmed) {
    if (busy) return;
    if (!confirmed && state.spoken.length && !confirm('Start a new sync? Today’s speaking order is cleared (away people, bonuses and the phrase of the day stay).')) return;
    state.spoken = []; state.history = []; save();
    Reels.idle(Logic.reelPool(state).length ? Logic.reelPool(state) : TEAM);
    flash('NEW SYNC ★ PULL THE LEVER!', 2400); render(); Lever.focus();
  }
  function toggleMute() { Sound.init(); Sound.setMuted(!Sound.muted); Store.savePrefs({ ...Store.prefs(), muted: Sound.muted }); render(); }

  addEventListener('keydown', (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey || e.repeat) return;
    const k = e.key;
    if (k === 'm' || k === 'M') { toggleMute(); return; }
    const onBtn = e.target && e.target.closest && e.target.closest('button, a, input, textarea, select');
    if (overlayMode) {
      if (overlayMode === 'pending') return;
      if (k === 'Escape' || ((k === ' ' || k === 'Enter') && !onBtn)) { e.preventDefault(); primary(); }
      return;
    }
    if ((k === ' ' || k === 'Enter') && (!onBtn || e.target.id === 'lever')) { e.preventDefault(); Lever.auto(); }
  });

  /* ---------------- start ---------------- */
  Lever.onPull(() => { pull(); });
  const startPool = Logic.reelPool(state);
  Reels.idle(startPool.length ? startPool : TEAM);
  layoutBulbs();
  render();
  if (Logic.isOver(state) && state.spoken.length) setTimeout(openFinale, 400);
  let rzT = 0;
  new ResizeObserver(() => { clearTimeout(rzT); rzT = setTimeout(() => { layoutBulbs(); if (!busy) Reels.redraw(); }, 60); }).observe(machine);
  addEventListener('resize', () => { if (!busy) Reels.redraw(); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { layoutBulbs(); Reels.redraw(); });

  if (Q.has('debug')) {
    window.slots = {
      force(id) { forced = id; return `next pull → ${id}`; },
      pull() { Lever.auto(); },
      get state() { return JSON.parse(JSON.stringify(state)); },
      simulate(n = 1) { for (let k = 0; k < n && !Logic.isOver(state); k++) { const r = Logic.pick(state, RNG); if (r.type === 'speaker') Logic.apply(state, r, RNG); else k--; } save(); render(); },
      act(name) { actions[name] && actions[name](); },
      finale() { openFinale(); },
      reset() { Store.wipe(); state = Store.load(); Reels.idle(Logic.reelPool(state)); closeOverlay(); },
    };
  }
}

if (Q.has('selftest')) runSelfTest(); else boot();
</script>
</body>
</html>
